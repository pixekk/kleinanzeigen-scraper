# Alternative to configuring via docker-compose.yml (CONFIG_YAML).
# Copy this file to config/searches.yaml if you prefer working with files.
# ${SMTP_HOST} and friends are substituted from .env / container env vars.

recipients:
  - ${MAIL_TO}

smtp:
  host: ${SMTP_HOST}
  port: 587
  user: ${SMTP_USER}
  password: ${SMTP_PASSWORD}
  from_address: ${SMTP_FROM}
  from_name: Kleinanzeigen Scanner
  security: starttls        # starttls | ssl | none

log_level: INFO
request_delay_seconds: 3    # pause between two requests

# Applies to all searches, overridable per search
defaults:
  interval_minutes: 15
  max_pages: 1              # 1 page = ~25 most recent listings
  only_offers: true         # no "wanted" ads
  exclude_sponsored: true   # ignore sponsored PRO listings
  seed_on_first_run: true   # first run only collects, no flood of mail
  include_free: true        # include "free to a good home" listings
  fetch_details: false      # also load the listing page (rarely needed)

searches:
  # Several models in one search: all terms, one shared mail
  - name: Mountain Bike
    queries:
      - mountainbike 29 zoll
      - mtb hardtail
    price_min: 100
    price_max: 500
    negotiable: any         # any = doesn't matter | only = negotiable only | exclude = fixed price only
    keywords:
      none_of: [defekt, bastler, ersatzteil]

  - name: Sofa
    query: sofa 3-sitzer
    price_min: 50
    price_max: 300
    include_without_price: false
    location_id: "3331"     # location ID from the Kleinanzeigen URL (.../k0l3331r30)
    radius_km: 30
    keywords:
      all_of: []            # ALL terms must be present
      any_of: [neuwertig, wenig benutzt]   # at least one must be present
      none_of: [defekt, wasserschaden]
    notify_on_price_drop: true

  # Ready-made browser URLs instead of search terms
  - name: Custom URLs
    enabled: false
    urls:
      - https://www.kleinanzeigen.de/s-stuttgart/laptop/k0l3331r20
    price_max: 300
